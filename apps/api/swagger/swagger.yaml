host: localhost:8080
info:
  contact: {}
  description: This is the API server for the Completionist application.
  title: Completionist API
  version: 2.0.0
paths:
  /admin/users:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of users for admin management
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - Admin
  /attachments:
    post:
      consumes:
      - application/json
      description: Creates a new standalone attachment record
      parameters:
      - description: Attachment Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createAttachmentBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Attachment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Attachment
      tags:
      - Attachments
  /attachments/by-entity:
    get:
      consumes:
      - application/json
      description: Retrieves all attachments linked to a specific entity
      parameters:
      - description: Entity Table Name
        in: query
        name: table
        required: true
        type: string
      - description: Entity Primary Key
        in: query
        name: pk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Attachment'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List Attachments by Entity
      tags:
      - Attachments
  /attachments/link:
    post:
      consumes:
      - application/json
      description: Links an existing attachment to an entity (post, comment, etc.)
      parameters:
      - description: Link Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.linkBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EntityAttachment'
        "400":
          description: Bad Request
