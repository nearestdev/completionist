services:
  api:
    image: completionist-api:prod
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GO_ENV: production
      SERVER_ADDR: :8080
      BACKEND_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - api_uploads:/app/uploads

  web:
    image: completionist-web:prod
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BACKEND_BASE_URL: ${WEB_BACKEND_BASE_URL:-http://localhost}
        BACKEND_PORT: ${WEB_BACKEND_PORT:-8080}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      - api
    ports:
      - "4000:4000"

volumes:
  api_uploads:
