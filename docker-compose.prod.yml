services:
  api:
    image: completionist-api:prod
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GO_ENV: production
      SERVER_ADDR: :8080
      BACKEND_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - api_uploads:/app/uploads

volumes:
  api_uploads:
